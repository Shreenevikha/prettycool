<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#070907">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>my boyfriend's pretty cool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=DM+Serif+Display&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="heart" viewBox="0 0 24 24">
      <path d="M12 21.2s-7.6-4.7-9.7-9.5C.8 8.3 2.8 4.3 6.7 4.3c2.2 0 3.7 1.3 5.3 3.2 1.6-1.9 3.1-3.2 5.3-3.2 3.9 0 5.9 4 4.4 7.4-2.1 4.8-9.7 9.5-9.7 9.5z" fill="currentColor"/>
    </symbol>
  </svg>

  <main class="stage" id="stage">
 

    <section class="card" id="card" data-theme="dark">
      <span class="handle">Romeo</span>

      <svg class="heart heart-corner" viewBox="0 0 24 24" aria-hidden="true"><use href="#heart"/></svg>
      <svg class="heart heart-left" viewBox="0 0 24 24" aria-hidden="true"><use href="#heart"/></svg>
      <svg class="heart heart-center" viewBox="0 0 24 24" aria-hidden="true"><use href="#heart"/></svg>
      <svg class="heart heart-right" viewBox="0 0 24 24" aria-hidden="true"><use href="#heart"/></svg>

      
    </section>

    <p class="hint" id="hint">tap anywhere to play</p>
  </main>

  <!--
    ===================== AUDIO PLACEHOLDER =====================
    Drop the ORIGINAL "Brooklyn Baby" by Lana Del Rey
    (Ultraviolence, Deluxe) into the audio/ folder as:
        audio/brooklyn-baby.mp3   (or audio/brooklyn-baby.m4a)
    Then set SONG_START at the top of main.js to the second in the
    track that sits 1.0s before "Yeah, my boyfriend's pretty cool".
    The edit runs through "...'cause I'm a Brooklyn baby" (16s).
    =============================================================
  -->
  <audio id="song" preload="auto" playsinline>
    <source src="audio/brooklyn-baby.mp3" type="audio/mpeg">
    <source src="audio/brooklyn-baby.m4a" type="audio/mp4">
  </audio>

  <script src="main.js"></script>
</body>
</html>
